<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-background font-sans text-textPrimary">
  <header class="p-md text-center">
    <h1 class="text-2xl font-bold">Personal Finance Dashboard</h1>
  </header>

  <main class="p-md space-y-lg">
    <!-- Summary Cards -->
    <section id="summary-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-md">
      <article class="card" id="card-balance">
        <h2 class="card-title">Total Balance</h2>
        <p class="card-value" id="total-balance">$0.00</p>
      </article>
      <article class="card" id="card-income">
        <h2 class="card-title">Total Income</h2>
        <p class="card-value" id="total-income">$0.00</p>
      </article>
      <article class="card" id="card-expenses">
        <h2 class="card-title">Total Expenses</h2>
        <p class="card-value" id="total-expenses">$0.00</p>
      </article>
      <article class="card" id="card-savings">
        <h2 class="card-title">Total Savings</h2>
        <p class="card-value" id="total-savings">$0.00</p>
      </article>
    </section>

    <!-- Category Filters -->
    <section id="filters" class="flex flex-wrap gap-sm justify-center">
      <!-- Buttons will be injected by script.js -->
    </section>

    <!-- Charts -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-lg">
      <article class="chart-card">
        <h2 class="chart-title">Spending by Category</h2>
        <canvas id="category-bar-chart" class="chart-canvas"></canvas>
      </article>
      <article class="chart-card">
        <h2 class="chart-title">Monthly Trend</h2>
        <canvas id="monthly-line-chart" class="chart-canvas"></canvas>
      </article>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
