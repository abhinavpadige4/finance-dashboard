<!DOCTYPE html>
<html lang="en" class="bg-bg text-text" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body class="font-sans">
  <header class="p-md bg-cardBg shadow-sm mb-md">
    <h1 class="text-2xl font-bold">Personal Finance Dashboard</h1>
  </header>

  <main class="container mx-auto p-md">
    <!-- Summary Cards -->
    <section class="summary-cards grid gap-md grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 mb-lg">
      <article class="card" id="card-balance">
        <h2 class="card__title text-muted">Total Balance</h2>
        <p class="card__value text-2xl font-medium" data-key="totalBalance"></p>
      </article>
      <article class="card" id="card-income">
        <h2 class="card__title text-muted">Income</h2>
        <p class="card__value text-2xl font-medium" data-key="totalIncome"></p>
      </article>
      <article class="card" id="card-expenses">
        <h2 class="card__title text-muted">Expenses</h2>
        <p class="card__value text-2xl font-medium" data-key="totalExpenses"></p>
      </article>
      <article class="card" id="card-savings">
        <h2 class="card__title text-muted">Savings</h2>
        <p class="card__value text-2xl font-medium" data-key="totalSavings"></p>
      </article>
    </section>

    <!-- Category Filter Buttons -->
    <section class="filter-group mb-lg flex flex-wrap gap-sm">
      <button class="filter-btn active" data-category="all">All</button>
      <!-- buttons will be populated by script -->
    </section>

    <!-- Charts -->
    <section class="charts grid gap-lg md:grid-cols-2">
      <div class="chart-card card p-sm">
        <h2 class="card__title text-muted mb-sm">Spending by Category</h2>
        <canvas id="categoryBarChart" class="w-full h-64"></canvas>
      </div>
      <div class="chart-card card p-sm">
        <h2 class="card__title text-muted mb-sm">Monthly Trend</h2>
        <canvas id="monthlyLineChart" class="w-full h-64"></canvas>
      </div>
    </section>
  </main>
</body>
</html>
